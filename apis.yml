name: Mia
description: 'Mia (Mia Labs, Inc.) is an AI-powered phone agent platform built specifically for
  automotive dealerships. Its conversational voice AI answers calls 24/7 across sales, service,
  reception, and outbound operations, handling appointment scheduling, service booking, lead
  capture, and recall/follow-up outreach over phone, SMS, and voice with automatic multi-language
  detection. Mia integrates with major dealership platforms and DMS/CRM systems including Tekion,
  CDK, Reynolds & Reynolds, and Dealertrack, and reports use across 350+ dealerships. The company
  raised a $20M Series A (roughly $29M total) backed by Norwest Venture Partners and Permanent
  Capital Ventures. This profile currently covers the company identity; no public developer API,
  documentation, or SDK surface was found during enrichment.'
